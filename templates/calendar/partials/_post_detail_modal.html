<!-- Published post preview + performance modal (content loaded via HTMX) -->
<div x-data="{ open: false }" style="display: contents;"
     @open-post-detail.window="document.getElementById('post-detail-content').innerHTML = '<p class=\'p-10 text-center text-sm text-stone-400\'>Carregando…</p>'; open = true"
     @close-post-detail.window="open = false">
    <template x-teleport="body">
        <div x-show="open" class="fixed inset-0 z-[60] flex items-center justify-center p-4"
             @keydown.escape.window="open = false"
             style="display: none;">
            <div class="fixed inset-0 bg-black/30 backdrop-blur-sm" @click="open = false"></div>
            <div id="post-detail-content"
                 class="relative bg-white rounded-2xl shadow-xl border border-stone-200 w-full max-w-md max-h-[90vh] overflow-hidden"
                 x-show="open"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"></div>
        </div>
    </template>
</div>
