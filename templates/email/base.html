{% load email_tags %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block email_title %}Jobz Social Media{% endblock %}</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
  body { margin: 0; padding: 0; width: 100% !important; }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F1F4F7;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
{# Hidden preview text shown by inboxes next to the subject #}
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F1F4F7;">
<tr><td align="center" style="padding:40px 16px;">

  <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background-color:#FFFFFF;border-radius:12px;border:1px solid #E5E7EB;">

    <!-- Header: Jobz logo -->
    <tr>
      <td style="padding:28px 32px 20px;border-bottom:1px solid #F1F4F7;">
        <img src="{% email_logo_url %}" alt="Jobz" width="66" height="32" style="display:block;width:66px;height:32px;">
      </td>
    </tr>

    <!-- Body -->
    <tr>
      <td style="padding:28px 32px 28px;">
        {% block content %}{% endblock %}
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="padding:20px 32px 28px;border-top:1px solid #F1F4F7;">
        <p style="margin:0;font-size:12px;color:#6B7280;line-height:1.6;">
          {% block footer_note %}{% endblock %}
        </p>
        <p style="margin:8px 0 0;font-size:12px;color:#9CA3AF;line-height:1.6;">Jobz Social Media</p>
      </td>
    </tr>

  </table>

</td></tr>
</table>
</body>
</html>
