<div class="media-order-controls">
    <button type="button" aria-label="Mover para a esquerda" title="Mover para a esquerda"
            onclick="event.preventDefault(); event.stopPropagation(); moveComposerMedia(this, -1)">←</button>
    <span class="media-position" aria-label="Posição"></span>
    <button type="button" aria-label="Mover para a direita" title="Mover para a direita"
            onclick="event.preventDefault(); event.stopPropagation(); moveComposerMedia(this, 1)">→</button>
</div>
